[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "active-memory"
version = "0.1.0"
description = "Independent, source-backed active graph memory for AI assistants"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi==0.143.0", "uvicorn==0.54.0", "httpx[socks]==0.28.1", "pydantic-settings==2.15.0", "neo4j==5.28.6", "mcp==1.30.0"]

[project.optional-dependencies]
graphiti = ["graphiti-core==0.30.2"]
dev = ["pytest==9.1.1", "ruff==0.17.0"]
build = ["setuptools==84.0.0", "wheel==0.48.0"]

[project.scripts]
active-memory = "active_memory.cli:main"
active-memory-mcp = "active_memory.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires an explicitly configured live Neo4j/model service"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

